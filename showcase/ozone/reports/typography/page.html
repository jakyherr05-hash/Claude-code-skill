<!doctype html><meta charset=utf-8><style>
@font-face{font-family:B;font-weight:200 800;font-stretch:75% 100%;src:url(b.woff2) format("woff2-variations")}
:root{--space-xs:clamp(0.6rem,0.57rem + 0.15vw,0.75rem);--space-3xs:0;
--t-h1:clamp(2.75rem,1.9545rem + 3.9773vw,4.5rem);--t-h2:clamp(1.5rem,1.0714rem + 2.1429vw,3.75rem);--cols:4;--margin:1rem;--gutter:.75rem}
@media (min-width:23.4375rem){:root{--margin:1.25rem}}
@media (min-width:48rem){:root{--cols:8;--margin:2rem;--gutter:1.25rem}}
@media (min-width:64rem){:root{--cols:12;--margin:2.5rem;--gutter:1.5rem}
:root{--t-h1:clamp(4.5rem,2.0385rem + 3.8462vw,6.75rem)}}
@media (min-width:90rem){:root{--margin:4rem}}
body{margin:0;font-family:B}
#box{height:100svh;position:relative}
#z{position:absolute;left:var(--margin);top:calc(var(--margin) + 44px + var(--space-xs));width:var(--w)}
.l1{font:800 var(--h1)/.92 B;font-stretch:75%;letter-spacing:.005em;text-wrap:balance;margin:0}
.l2{font:500 var(--h2)/1.08 B;font-stretch:100%;text-wrap:balance;margin:.4em 0 0}
</style><div id=box><div id=z><h1 class=l1>EVERY STORY STARTS SOMEWHERE.</h1><p class=l2 style="margin-top:0">MAKE SURE YOURS STARTS RIGHT.</p></div></div>
