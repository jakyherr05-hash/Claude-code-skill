<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Carousel</title>
  <script>
    // Hide animated parts only when JS runs; reveal anyway if the module never starts.
    document.documentElement.classList.add('js-motion');
    setTimeout(function () { if (!document.documentElement.classList.contains('motion-ready')) document.documentElement.classList.remove('js-motion'); }, 4000);
  </script>
</head>
<body>
  <main class="page">
    <header class="masthead" aria-label="Collection">
      <span class="word"><span>Art</span></span>
      <span class="word"><span>Of</span></span>
      <span class="word"><span>2026</span></span>
    </header>

    <section class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="Featured images">
      <div class="stage" data-stage>
        <figure class="card" data-card data-title="Prompt guide" data-tag="For UI/UX designers">
          <img src="/slides/01.jpg" alt="Poster: a person in a glowing visor under the title ChatGPT Prompt Guide for UI/UX designers" width="1080" height="1080" />
          <span class="dim" aria-hidden="true"></span>
        </figure>
        <figure class="card" data-card data-title="Shock resist" data-tag="Three-quarter view">
          <img src="/slides/02.jpg" alt="Black G-Shock watch at an angle on a black background" width="1080" height="1080" />
          <span class="dim" aria-hidden="true"></span>
        </figure>
        <figure class="card" data-card data-title="Analog digital" data-tag="Front view">
          <img src="/slides/03.jpg" alt="Black G-Shock watch, front view on a white background" width="1080" height="1080" />
          <span class="dim" aria-hidden="true"></span>
        </figure>
        <figure class="card" data-card data-title="Protection" data-tag="Studio light">
          <img src="/slides/04.jpg" alt="Black G-Shock watch, front view lit from above on a black background" width="1080" height="1080" />
          <span class="dim" aria-hidden="true"></span>
        </figure>
        <figure class="card" data-card data-title="Everyday wear" data-tag="On the wrist">
          <img src="/slides/05.jpg" alt="G-Shock watch on a wrist in front of a brick wall, striped sleeve" width="1080" height="1080" />
          <span class="dim" aria-hidden="true"></span>
        </figure>
      </div>

      <div class="caption" aria-live="polite">
        <h1 class="title"><span data-caption-title>Prompt guide</span></h1>
        <p class="tag"><span data-caption-tag>For UI/UX designers</span></p>
      </div>

      <nav class="controls" aria-label="Carousel controls">
        <button class="arrow" type="button" data-prev aria-label="Previous slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <div class="dots" data-dots></div>
        <button class="arrow" type="button" data-next aria-label="Next slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </nav>
      <p class="hint" aria-hidden="true">Swipe or drag</p>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
