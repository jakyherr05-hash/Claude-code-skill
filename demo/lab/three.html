<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab · Three.js stage template</title>
    <style>
      html, body { margin: 0; background: #0d0c0b; color: #a39c90; font: 12px/1.4 ui-monospace, monospace; }
      #host { width: 100vw; height: 100vh; }
      #host canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; }
      body.clean #ui { display: none; }
    </style>
  </head>
  <body>
    <div id="host"><canvas aria-hidden="true"></canvas></div>
    <div id="ui"><label>progress <input id="p" type="range" min="0" max="1" step="0.01" value="0" /></label></div>
    <script type="module" src="./three-lab.ts"></script>
  </body>
</html>
